name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: ./go-service
      - run: go test -race -count=1 ./...

  py-test:
    name: Python service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [go-test, py-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t market-data:ci ./go-service
      - run: docker build -t ai-analyst:ci ./py-service
